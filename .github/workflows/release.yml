name: release

on:
  release:
    types:
      - published

jobs:
  test:
    name: Test (py${{ matrix.python }} • ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # don't let prerelease-Python breakage fail the workflow or fail-fast-cancel the stable jobs
    continue-on-error: ${{ matrix.python == '3.15' }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          # lets "3.15" resolve to the latest beta/rc until 3.15.0 final ships;
          # versions with a stable release are unaffected
          allow-prereleases: true

      # since v5, setup-uv also caches the uv cache dir automatically on hosted runners
      - uses: astral-sh/setup-uv@v7

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Run pytest
        run: uv run pytest

  pypi-publish:
    name: Build and upload to PyPI
    needs: [test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # required for trusted publishing (no saved secrets)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      # pin to a specific uv version that works so we don't get burned by breaking changes later
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 0.9.7

      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
